name: 'Fetch Doppler Secrets'
description: 'Fetch Doppler secrets for a specific Project and Config'
branding:
  icon: 'lock'
  color: 'blue'
inputs:
  auth-method:
    description: >- 
      Auth method to use.
      - "token" (default): Authenticate with a static API token (`doppler-token`)
      - "oidc": Authenticate via OIDC. Note that this requires the `id-token: write` permission on the Github job or workflow. See https://docs.doppler.com/docs/service-account-identities
    default: "token"
  doppler-token:
    description: >-
      Doppler Service Token that grants access to a single Config within a Project. 
      See https://docs.doppler.com/docs/service-tokens
    required: false
  doppler-project:
    description: >-
      Doppler Project
    required: false
  doppler-config:
    description: >-
      Doppler Config slug (e.g. prd)
    required: false
  inject-env-vars:
    description: >-
      Inject secrets as environment variables for subsequent steps if set to `true`.
    required: false
  doppler-identity-id:
    description: >-
      Identity to use, required when auth-method is "oidc".
    required: false
  on-invalid-name:
    description: >-
      How to handle secret names that cannot be used as-is in a workflow, such as
      names containing dashes or forward slashes.
      - "warn" (default): set the secret anyway and log how to read it
      - "error": fail the step, listing every affected name
      - "skip": omit the affected output or environment variable
      Names containing a newline, carriage return, null byte, or "=" are always
      skipped and always fail the step, since they cannot be written safely.
    default: "warn"
    required: false
  doppler-api-domain:
    default: "api.doppler.com"
    required: false
runs:
  using: 'node24'
  main: 'bin/index.js'
