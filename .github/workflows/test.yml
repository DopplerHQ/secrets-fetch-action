name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify_build:
    runs-on: ubuntu-latest
    name: Verify build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Check for uncommitted build output
        run: |
          # --intent-to-add so that newly generated, untracked files show up in the diff
          git add --intent-to-add .
          if ! git diff --exit-code; then
            echo "::error::Build output differs from what is committed. Run 'pnpm run build' and commit the result."
            exit 1
          fi
  service-token-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
        env:
          NODE_ENV: development
          DOPPLER_TOKEN: ${{ secrets.TEST_DOPPLER_TOKEN }}
  service-account-token-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
        env:
          NODE_ENV: development
          DOPPLER_TOKEN: ${{ secrets.TEST_DOPPLER_SA_TOKEN }}
          DOPPLER_PROJECT: secrets-fetch-action
          DOPPLER_CONFIG: test
